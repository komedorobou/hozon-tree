<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>保存ルール　枝を生やす</title>
<style>
:root{--sideW:300px;--sumi:#1a1c1b;--ai:#16324f;--kin:#a8823c;--shu:#c8412f;--bg:#eceae3;--paper:#fdfdfb;--line:#c9c7bf}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--sumi);font:15px/1.6 "Yu Gothic UI","Meiryo",sans-serif;
     overflow:hidden;user-select:none}
header{position:fixed;inset:0 0 auto 0;z-index:10;background:var(--ai);color:#fff;
       padding:10px 20px;display:flex;align-items:center;gap:16px}
header .t{font-weight:700;letter-spacing:.14em;font-size:13px}
header .h{font-size:12px;opacity:.72}
header .h b{color:#f0d79a;font-weight:700}
header .sp{flex:1}
header button{font:inherit;font-size:13px;padding:5px 13px;border:1px solid #ffffff40;background:none;
              color:#fff;border-radius:4px;cursor:pointer}
header button:hover{background:#ffffff1a}

#stage{position:absolute;inset:44px var(--sideW) 0 0;overflow:hidden;cursor:grab}
#side{position:fixed;top:44px;right:0;bottom:0;width:var(--sideW);background:var(--paper);
      border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:8}
#side h2{margin:0;padding:9px 14px;font-size:12px;letter-spacing:.1em;color:#55554f;
         border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
#side h2 .n{margin-left:auto;font-weight:400;color:#98968e;font-size:11px}
#side h2{cursor:pointer;user-select:none}
#side h2:hover{background:#f0f1ec}
#side h2 .fold{width:12px;font-size:10px;color:#8a8880}
#side .list{flex:1;overflow:auto;padding:4px 0;min-height:80px}
#side #zList{flex:0 0 38%;border-top:1px solid var(--line)}
#side #zHead{border-top:1px solid var(--line)}
#side .zpath{padding:2px 14px 6px;font-size:11px;color:#a5a39b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .it{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:13px;white-space:nowrap}
#side .it:hover{background:#f0f1ec}
#side .it .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
#side .it .tw{width:12px;flex:none;color:#8a8880;font-size:10px;cursor:pointer;text-align:center}
#side .it .tw:hover{color:var(--ai)}
#side .it .mt{font-size:10px;color:#a5a39b}
#side .it.link .nm{color:#6f8fae}
#side .it.junk .nm{color:#b3aa93;text-decoration:line-through}
#side .foot{flex:none;border-top:1px solid var(--line);padding:6px 12px;font-size:11px;color:#8a8880}
#side .dead{padding:16px 14px;font-size:12px;color:#8a8880;line-height:1.8}
#side .dead b{color:var(--shu)}
#grip{position:fixed;top:44px;bottom:0;right:var(--sideW);width:7px;margin-right:-3px;
      cursor:col-resize;z-index:9;background:transparent}
#grip:hover,#grip.on{background:#16324f33}
.pickbtn{margin:6px 0;padding:7px 14px;border:1px solid var(--ai);background:var(--ai);color:#fff;border-radius:4px;font:inherit;font-size:13px;cursor:pointer}
.pickbtn:hover{opacity:.88}
.smenu{position:fixed;z-index:30;background:#fff;border:1px solid var(--line);border-radius:7px;
       box-shadow:0 8px 22px #00000030;padding:5px;min-width:190px;display:none;font-size:13px}
.smenu.on{display:block}
.smenu div{padding:7px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
.smenu div:hover{background:#eef2f7}
.smenu div.dan{color:var(--shu)}
.smenu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
#side .it.pick{background:#dbe6f2}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
path{fill:none;stroke:var(--line);stroke-width:2}
path.grow{stroke-dasharray:400;stroke-dashoffset:400;animation:draw .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.node{position:absolute;display:flex;align-items:center;height:34px;padding:0 14px;background:var(--paper);
      border:1px solid var(--line);border-radius:17px;white-space:nowrap;cursor:pointer;
      box-shadow:0 1px 2px #00000012;transition:border-color .12s,box-shadow .12s}
.node:hover{border-color:var(--ai)}
.node.sel{border-color:var(--ai);box-shadow:0 0 0 3px #16324f22}
.node.root{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:700;letter-spacing:.08em}
.node.pop{animation:pop .34s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.node .cnt{margin-left:9px;font-size:11px;color:#98968e}
.node.root .cnt{color:#ffffff8c}
.node input{font:inherit;border:none;outline:none;background:transparent;color:inherit;width:9em}

.plus{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--paper);
      border:1px solid var(--line);color:var(--ai);display:grid;place-items:center;font-size:16px;
      line-height:1;cursor:pointer;opacity:.28;transition:.12s;z-index:3}
.plus:hover{background:var(--ai);color:#fff;border-color:var(--ai);opacity:1}
.plus.on{opacity:1;border-color:var(--ai)}
body.editing .plus{display:none}
.arw{position:absolute;width:28px;height:22px;display:grid;place-items:center;font-size:13px;
     color:var(--ai);background:var(--paper);border:1px solid var(--line);cursor:pointer;z-index:3}
.arw:first-of-type{border-radius:4px 4px 0 0}
.arw:hover{background:var(--ai);color:#fff;border-color:var(--ai)}
.arw.off{opacity:.25;cursor:default}
.arw.off:hover{background:var(--paper);color:var(--ai);border-color:var(--line)}
body.editing .arw{display:none}
.node.dragging{opacity:.92;box-shadow:0 12px 24px -10px #0007;z-index:6;cursor:grabbing;border-color:var(--kin)}
.node.tgt{border-color:var(--kin);box-shadow:0 0 0 3px #a8823c33}
.bar{position:absolute;height:3px;background:var(--kin);border-radius:2px;pointer-events:none;z-index:5}
body.dragging .plus,body.dragging .arw{display:none}

footer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
       padding:6px 18px;font-size:12px;color:#77776f;display:flex;gap:22px}
footer b{color:var(--sumi)}
</style>
</head>
<body>

<header>
  <span class="t">保存ルール　枝を生やす</span>
  <span class="h"><b>Tab</b> 枝を伸ばす　<b>Enter</b> 隣に生やす　<b>↑↓</b> 順番を入れ替え<b>F2</b> 名前　<b>Del</b> 切る　<b>Ctrl+Z</b> 戻す</span>
  <span class="sp"></span>
  <span id="sync" class="h"></span>
  <button id="cloud">今すぐ保存</button>
  <button id="fit">全体を見る</button>
  <button id="ex">.txt で保存</button>
</header>

<div id="stage">
  <div id="world">
    <svg id="wires"></svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="sideMenu" class="smenu"></div>
<div id="grip" title="ドラッグで幅を変えられる"></div>
<aside id="side">
  <h2 id="dtHead"><span class="fold">▾</span>🖥 いまのデスクトップ<span class="n" id="dtCount"></span></h2>
  <div class="list" id="dtList"></div>
  <div class="foot" id="dtFoot">読み込み中…</div>
  <h2 id="zHead"><span class="fold">▾</span>📂 枝の中身<span class="n" id="zCount"></span></h2>
  <div class="list" id="zList"><div class="dead">枝をクリックしたら、その中に何が入ってるか出る</div></div>
</aside>

<footer><span id="s1"></span><span id="s2"></span><span>形を決めるだけ。ファイルは一切動かさん</span></footer>

<script>
const ROW = 46, COL = 236;
let uid = 1, sel = null, undo = [], views = [];
let tree = load() || { id: "r", name: "Z（本置き場）", kids: [] };

function load() { try { return JSON.parse(localStorage.getItem("eda")) } catch { return null } }
function save() { localStorage.setItem("eda", JSON.stringify(tree)); }
function touch() { dirty = true; syncLabel(); autoPush(); }

let autoT;
function autoPush() {
  clearTimeout(autoT);
  autoT = setTimeout(() => push(false), 1200);
}

/* ---- クラウドに置く（どのPCからでも同じ形。鍵はサーバー側） ---- */
const API = "https://hozon-tree-api.vercel.app/api/tree";
let dirty = false, pulling = true;

let saving = false, offline = false;
const syncLabel = () => {
  document.getElementById("sync").textContent =
    pulling ? "読み込み中…" : saving ? "保存中…"
    : offline ? "つながらん（このPCには残ってる）"
    : dirty ? "未保存" : "保存済み";
};

async function pull() {
  try {
    const r = await fetch(API + "?t=" + Math.random());
    const j = await r.json();
    if (j.tree && j.tree.kids) { tree = j.tree; localStorage.setItem("eda", JSON.stringify(tree)); }
    offline = false;
  } catch (e) { offline = true; }
  pulling = false; dirty = false; syncLabel(); render(); fit();
}

async function push(manual) {
  saving = true; syncLabel();
  try {
    const r = await fetch(API, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tree })
    });
    saving = false;
    if (!r.ok) { offline = true; syncLabel(); if (manual) alert("保存でけへんかった：" + r.status); return; }
    offline = false; dirty = false; syncLabel();
  } catch (e) {
    saving = false; offline = true; syncLabel();
    if (manual) alert("つながらんかった。ネットが復活したらまた保存される。");
  }
}
function snap() { undo.push(JSON.stringify(tree)); if (undo.length > 60) undo.shift(); touch(); }

const find = (id, n = tree) => n.id === id ? n : n.kids.reduce((a, k) => a || find(id, k), null);
const parentOf = (id, n = tree) => n.kids.some(k => k.id === id) ? n : n.kids.reduce((a, k) => a || parentOf(id, k), null);
const count = n => n.kids.reduce((a, k) => a + 1 + count(k), 0);

/* ---- 配置 ---- */
function layout() {
  let y = 0;
  const walk = (n, d) => {
    n.x = 30 + d * COL;
    if (!n.kids.length) { n.y = y; y += ROW; }
    else {
      n.kids.forEach(k => walk(k, d + 1));
      n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2;
    }
  };
  walk(tree, 0);
}

/* ---- 描画 ---- */
function render(grownId) {
  layout();
  const nodes = document.getElementById("nodes"), wires = document.getElementById("wires");
  nodes.innerHTML = ""; wires.innerHTML = ""; views = [];

  const draw = n => {
    const el = document.createElement("div");
    el.className = "node" + (n.id === "r" ? " root" : "") + (sel === n.id ? " sel" : "") + (n.id === grownId ? " pop" : "");
    el.style.left = n.x + "px"; el.style.top = n.y + "px";
    const c = n.kids.length ? `<span class="cnt">${n.kids.length}</span>` : "";
    el.innerHTML = `<span class="lb"></span>${c}`;
    el.querySelector(".lb").textContent = n.name;
    el.onclick = e => { e.stopPropagation(); if (moved) return; sel = n.id; render(); if (typeof showBranch === "function") showBranch(n.id); };
    el.ondblclick = e => { e.stopPropagation(); sel = n.id; rename(); };
    el.onmousedown = e => { e.stopPropagation(); if (n.id !== "r") startDrag(n, el, e); };
    // 右のデスクトップ一覧からのドロップを受ける
    el.ondragover = ev => { ev.preventDefault(); el.classList.add("tgt"); };
    el.ondragleave = () => el.classList.remove("tgt");
    el.ondrop = ev => {
      ev.preventDefault(); el.classList.remove("tgt");
      const d = ev.dataTransfer.getData("text/plain") || "";
      if (d.startsWith("dt:")) stow(d.slice(3), n.id);
    };
    nodes.appendChild(el);
    views.push({ n, el });

    const p = document.createElement("div");
    p.className = "plus" + (sel === n.id ? " on" : "");
    p.textContent = "＋";
    p.style.left = (n.x + el.offsetWidth + 4) + "px";
    p.style.top = (n.y + 4) + "px";
    p.onclick = e => { e.stopPropagation(); sel = n.id; addChild(); };
    nodes.appendChild(p);

    if (sel === n.id && n.id !== "r") {
      const p = parentOf(n.id), i = p.kids.findIndex(k => k.id === n.id);
      [["▲", -1, i > 0], ["▼", 1, i < p.kids.length - 1]].forEach(([t, dir, ok], j) => {
        const b = document.createElement("div");
        b.className = "arw" + (ok ? "" : " off");
        b.textContent = t;
        b.style.left = (n.x - 34) + "px";
        b.style.top = (n.y - 5 + (j ? 22 : 0)) + "px";
        if (ok) b.onclick = e => { e.stopPropagation(); moveSib(dir); };
        nodes.appendChild(b);
      });
    }

    n.kids.forEach(k => {
      const x1 = n.x + el.offsetWidth, y1 = n.y + 17, x2 = k.x, y2 = k.y + 17, mx = (x1 + x2) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      if (k.id === grownId) path.setAttribute("class", "grow");
      wires.appendChild(path);
      draw(k);
    });
  };
  draw(tree);

  document.getElementById("s1").innerHTML = `フォルダー <b>${count(tree)}</b>個`;
  const deep = (n, d = 0) => n.kids.length ? Math.max(...n.kids.map(k => deep(k, d + 1))) : d;
  document.getElementById("s2").innerHTML = `深さ <b>${deep(tree)}</b>段`;
  save();
}

/* ---- 操作 ---- */
function addChild() {
  const n = find(sel || "r"); if (!n) return;
  snap();
  const k = { id: "n" + (uid++) + Date.now().toString(36), name: "", kids: [] };
  n.kids.push(k); sel = k.id;
  render(k.id); rename(true);
}
function addSibling() {
  if (!sel || sel === "r") return addChild();
  const p = parentOf(sel); if (!p) return;
  snap();
  const k = { id: "n" + (uid++) + Date.now().toString(36), name: "", kids: [] };
  p.kids.splice(p.kids.findIndex(x => x.id === sel) + 1, 0, k);
  sel = k.id; render(k.id); rename(true);
}
function rename(isNew) {
  const n = find(sel); if (!n) return;
  const el = [...document.querySelectorAll(".node")].find(e => e.querySelector(".lb")?.textContent === n.name && e.style.left === n.x + "px" && e.style.top === n.y + "px");
  if (!el) return;
  const lb = el.querySelector(".lb");
  const inp = document.createElement("input");
  inp.value = n.name; lb.replaceWith(inp); inp.focus(); inp.select();
  document.body.classList.add("editing");
  const fin = ok => {
    document.body.classList.remove("editing");
    const v = inp.value.trim();
    if (ok && v) { if (!isNew) snap(); n.name = v; touch(); }   // 名前も必ず保存する
    else if (isNew || !n.name.trim()) {      // 名前が空の枝は残さん（見えへん枝ができる）
      const p = parentOf(n.id);
      if (p) { p.kids = p.kids.filter(k => k.id !== n.id); sel = p.id; }
      touch();
    }
    render();
  };
  inp.onblur = () => fin(true);
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === "Enter") { inp.onblur = null; fin(true); setTimeout(addSibling, 0); }
    else if (e.key === "Tab") { e.preventDefault(); inp.onblur = null; fin(true); setTimeout(addChild, 0); }
    else if (e.key === "Escape") { inp.onblur = null; fin(false); }
  };
}
function cut() {
  if (!sel || sel === "r") return;
  const n = find(sel), p = parentOf(sel);
  if (count(n) && !confirm(`「${n.name}」と、その先の枝 ${count(n)}個を切る。ええ？`)) return;
  snap();
  p.kids = p.kids.filter(k => k.id !== sel);
  sel = p.id; render();
}
function undoIt() {
  if (!undo.length) return;
  tree = JSON.parse(undo.pop()); touch(); render();
}

/* ---- ドラッグ（付け替え・割り込み） ---- */
let moved = false;
const isUnder = (id, n) => n.kids.some(k => k.id === id || isUnder(id, k));

function startDrag(n, el, ev) {
  moved = false;
  const st = stage.getBoundingClientRect();
  const toWorld = e => ({ x: (e.clientX - st.left - ox) / sc, y: (e.clientY - st.top - oy) / sc });
  const p0 = toWorld(ev), gx = p0.x - n.x, gy = p0.y - n.y;
  const bar = document.createElement("div"); bar.className = "bar";
  let drop = null;

  const mv = e => {
    const p = toWorld(e);
    if (!moved && Math.hypot(p.x - p0.x, p.y - p0.y) * sc < 5) return;
    if (!moved) {
      moved = true;
      document.body.classList.add("dragging");
      el.classList.add("dragging");
      document.getElementById("nodes").appendChild(bar);
    }
    el.style.left = (p.x - gx) + "px"; el.style.top = (p.y - gy) + "px";

    drop = null; bar.style.display = "none";
    views.forEach(v => v.el.classList.remove("tgt"));
    for (const v of views) {
      if (v.n.id === n.id || isUnder(v.n.id, n)) continue;
      const w = v.el.offsetWidth, x = v.n.x, y = v.n.y;
      if (p.x < x - 12 || p.x > x + w + 12 || p.y < y - 10 || p.y > y + 44) continue;
      const rel = (p.y - y) / 34;
      if (v.n.id !== "r" && (rel < .32 || rel > .68)) {
        const before = rel < .32;
        drop = { mode: "sib", t: v.n, before };
        bar.style.display = "block";
        bar.style.left = x + "px"; bar.style.width = w + "px";
        bar.style.top = (before ? y - 7 : y + 37) + "px";
      } else {
        drop = { mode: "kid", t: v.n };
        v.el.classList.add("tgt");
      }
      break;
    }
  };

  const up = () => {
    removeEventListener("mousemove", mv); removeEventListener("mouseup", up);
    document.body.classList.remove("dragging");
    bar.remove();
    views.forEach(v => v.el.classList.remove("tgt"));
    if (moved && drop) {
      snap();
      const old = parentOf(n.id);
      old.kids = old.kids.filter(k => k.id !== n.id);
      if (drop.mode === "kid") find(drop.t.id).kids.push(n);
      else {
        const p2 = parentOf(drop.t.id);
        const i = p2.kids.findIndex(k => k.id === drop.t.id);
        p2.kids.splice(drop.before ? i : i + 1, 0, n);
      }
      sel = n.id; render(n.id);
    } else if (moved) render();     // 動かしてない時は描き直さん（クリックが消えるので）
    setTimeout(() => moved = false, 0);
  };
  addEventListener("mousemove", mv); addEventListener("mouseup", up);
}

/* ---- ▲▼で並べ替え ---- */
function moveSib(dir) {
  if (!sel || sel === "r") return;
  const p = parentOf(sel), i = p.kids.findIndex(k => k.id === sel), j = i + dir;
  if (j < 0 || j >= p.kids.length) return;
  snap();
  [p.kids[i], p.kids[j]] = [p.kids[j], p.kids[i]];
  render();
}

/* ---- 表示 ---- */
let sc = 1, ox = 0, oy = 0;
const world = document.getElementById("world"), stage = document.getElementById("stage");
const apply = () => world.style.transform = `translate(${ox}px,${oy}px) scale(${sc})`;
stage.onmousedown = e => {
  if (e.target.closest(".node,.plus,.arw")) return;
  sel = null; render();
  const sx = e.clientX - ox, sy = e.clientY - oy;
  stage.classList.add("drag");
  const mv = m => { ox = m.clientX - sx; oy = m.clientY - sy; apply(); };
  const up = () => { stage.classList.remove("drag"); removeEventListener("mousemove", mv); removeEventListener("mouseup", up); };
  addEventListener("mousemove", mv); addEventListener("mouseup", up);
};
stage.onwheel = e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.1 : 1 / 1.1, nx = Math.min(2, Math.max(.35, sc * k));
  ox = e.clientX - (e.clientX - ox) * (nx / sc); oy = e.clientY - (e.clientY - oy) * (nx / sc);
  sc = nx; apply();
};
function fit() {
  layout();
  let maxX = 0, maxY = 0;
  const w = n => { maxX = Math.max(maxX, n.x + 260); maxY = Math.max(maxY, n.y + 60); n.kids.forEach(w); };
  w(tree);
  sc = Math.min(1, (stage.clientWidth - 40) / maxX, (stage.clientHeight - 40) / maxY);
  ox = 20; oy = 20; apply();
}

addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Tab") { e.preventDefault(); addChild(); }
  else if (e.key === "Enter") { e.preventDefault(); addSibling(); }
  else if (e.key === "F2") rename();
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSib(-1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); moveSib(1); }
  else if (e.key === "Delete" || e.key === "Backspace") cut();
  else if (e.ctrlKey && e.key.toLowerCase() === "z") undoIt();
});
document.getElementById("fit").onclick = fit;
document.getElementById("ex").onclick = () => {
  const out = [];
  const w = (n, ind, last, top) => {
    out.push(top ? n.name : ind + (last ? "└─ " : "├─ ") + n.name);
    const ni = top ? "" : ind + (last ? "   " : "│  ");
    n.kids.forEach((k, i) => w(k, ni, i === n.kids.length - 1, false));
  };
  w(tree, "", true, true);
  const b = new Blob(["﻿" + out.join("\r\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "保存ルール_ツリー.txt"; a.click();
};

document.getElementById("cloud").onclick = () => push(true);
addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

/* ---- 右：いまのデスクトップ（ブラウザが直にフォルダを見る。どのPCでも同じ） ---- */

/* 選んだフォルダの権利をブラウザに覚えさせる小さな入れ物 */
const store = {
  db: null,
  open() {
    return this.db ? Promise.resolve(this.db) : new Promise((ok, ng) => {
      const q = indexedDB.open("seiri", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("h");
      q.onsuccess = () => { this.db = q.result; ok(this.db); };
      q.onerror = () => ng(q.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise(ok => {
      const r = db.transaction("h").objectStore("h").get(k);
      r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise(ok => {
      const r = db.transaction("h", "readwrite").objectStore("h").put(v, k);
      r.onsuccess = r.onerror = () => ok();
    });
  }
};

let deskH = null, zH = null;
const canFS = "showDirectoryPicker" in window;

async function allow(h) {                       // 権利があるか確かめる（無ければ聞く）
  if (!h) return null;
  const opt = { mode: "readwrite" };
  if (await h.queryPermission(opt) === "granted") return h;
  if (await h.requestPermission(opt) === "granted") return h;
  return null;
}

/* Chromeはデスクトップ本体を選ばせてくれん。親（OneDrive）を選んでもろて中を掘る */
async function digDesktop(h) {
  const kids = [];
  for await (const [n, e] of h.entries()) if (e.kind === "directory") kids.push(n);
  for (const c of ["デスクトップ", "Desktop"]) {
    if (kids.includes(c)) return await h.getDirectoryHandle(c);
  }
  return h;                       // 既にデスクトップそのものやった場合
}

async function pick(which) {
  try {
    let h = await showDirectoryPicker({ id: which, mode: "readwrite" });
    if (which === "desk") { h = await digDesktop(h); deskH = h; }
    else zH = h;
    await store.set(which, h);
    listDesktop();
  } catch (e) {
    if (e && e.name === "AbortError") return;
    alert("そのフォルダは選べんかった：" + (e.message || e)
      + "\n\nデスクトップは Chrome が直接は開かせてくれん。"
      + "\nひとつ上の「OneDrive」フォルダを選んで。中のデスクトップを勝手に使う。");
  }
}

/* 枝の道順（根＝Zそのものなので根の名前は含めん） */
function pathOf(id) {
  const walk = (nodes, trail) => {
    for (const n of nodes) {
      const t = trail.concat(n.name);
      if (n.id === id) return t;
      const r = walk(n.kids, t);
      if (r) return r;
    }
    return null;
  };
  return id === "r" ? [] : (walk(tree.kids, []) || []);
}

const dtIcon = e => {
  if (e.dir) return "📁";
  const x = e.name.toLowerCase();
  if (/\.(lnk|url)$/.test(x)) return "🔗";
  if (/\.(xlsx|xls|xlsm)$/.test(x)) return "🟩";
  if (/\.docx?$/.test(x)) return "🟦";
  if (/\.pptx?$/.test(x)) return "🟧";
  if (/\.pdf$/.test(x)) return "🟥";
  if (/\.(mp4|mov|avi)$/.test(x)) return "🎬";
  if (/\.(jpe?g|png|gif|bmp)$/.test(x)) return "🖼️";
  if (/\.(accdb|mdb)$/.test(x)) return "🗄️";
  if (/\.zip$/.test(x)) return "🗜️";
  return "📄";
};
const dtKind = e => e.name.startsWith("~$") ? "junk"
  : /\.(lnk|url)$/i.test(e.name) ? "link" : e.dir ? "dir" : "file";
const foot = t => document.getElementById("dtFoot").textContent = t;

/* ---- ①このPCの読み役（いちばん楽。ダイアログ無し） ---- */
const HELPER = "http://127.0.0.1:8777";
let mode = "";                       // helper / fs / mirror
const stamp = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

async function tryHelper() {
  const r = await fetch(HELPER + "/api/desktop?t=" + Math.random());
  const d = await r.json();
  mode = "helper";
  dtTop = d.items.map(e => ({ name: e.name, rel: e.name, dir: e.dir, mtime: (e.mtime || "").slice(0, 10), depth: 0 }));
  renderRows();
  foot("フォルダは ▸ で中を見られる／枝にドラッグでZへ");
  fetch(API + "?kind=desktop", {                      // 他のPCで見るための写し
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tree: { items: d.items, total: d.total, links: d.links, at: stamp() } })
  }).catch(() => { });
}

async function tryMirror() {
  const r = await fetch(API + "?kind=desktop&t=" + Math.random());
  const j = await r.json();
  if (!j.tree || !j.tree.items) throw 0;
  mode = "mirror";
  drawDesktop(j.tree.items.map(e => ({ name: e.name, dir: e.dir, mtime: (e.mtime || "").slice(0, 10) })));
  foot(`${j.tree.at} 時点の写し（このPCでは動かせん）`);
}

/* デスクトップを読んで並べる */
async function listDesktop() {
  const list = document.getElementById("dtList");
  try { await tryHelper(); return; } catch (e) { }
  if (!canFS) {
    list.innerHTML = `<div class="dead"><b>このブラウザでは使えん</b><br>Chrome か Edge で開いて。</div>`;
    foot("—"); return;
  }
  deskH = await allow(deskH || await store.get("desk"));
  zH = await allow(zH || await store.get("z"));
  if (!deskH || !zH) {
    try { await tryMirror(); return; } catch (e) { }
    list.innerHTML = `<div class="dead">
      このPCで一度だけ場所を教えて。<br><br>
      <button class="pickbtn" id="pk1">${deskH ? "✓ " : ""}① OneDrive フォルダを選ぶ</button><br>
      <span style="font-size:11px">C:\\Users\\KSR\\<b>OneDrive</b> を選んで「フォルダーの選択」→「編集を許可」。<br>
      中の「デスクトップ」を自動で使う（Chromeがデスクトップ直接は拒むため）</span><br><br>
      <button class="pickbtn" id="pk2">${zH ? "✓ " : ""}② Z ドライブを選ぶ</button><br><br>
      次からは覚えてる（PCごとに1回）。</div>`;
    document.getElementById("pk1").onclick = () => pick("desk");
    document.getElementById("pk2").onclick = () => pick("z");
    document.getElementById("dtCount").textContent = "";
    foot("場所を教えてもろたら出る"); return;
  }

  const items = [];
  for await (const [name, h] of deskH.entries()) {
    if (name.toLowerCase() === "desktop.ini") continue;
    let mtime = "", size = 0;
    if (h.kind === "file") {
      try { const f = await h.getFile(); mtime = new Date(f.lastModified).toISOString().slice(0, 10); size = f.size; }
      catch (e) { }
    }
    items.push({ name, dir: h.kind === "directory", mtime, size });
  }
  items.sort((a, b) => a.dir !== b.dir ? (a.dir ? -1 : 1) : a.name.localeCompare(b.name, "ja"));
  drawDesktop(items);
  foot("枝にドラッグしたら、そこへ入る");
}

/* 一覧（フォルダは開いて中を見られる） */
let dtTop = [], dtOpen = new Set(), dtKids = {};

async function loadKids(rel) {
  if (dtKids[rel]) return dtKids[rel];
  if (mode !== "helper") return [];
  const r = await fetch(HELPER + "/api/list?path=" + encodeURIComponent("デスクトップ\\" + rel) + "&t=" + Math.random());
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  dtKids[rel] = j.entries.map(e => ({
    name: e.name, rel: rel + "\\" + e.name, dir: e.dir, mtime: (e.mtime || "").slice(0, 10)
  }));
  return dtKids[rel];
}

async function toggleDir(rel) {
  if (dtOpen.has(rel)) { dtOpen.delete(rel); renderRows(); return; }
  try { await loadKids(rel); dtOpen.add(rel); renderRows(); }
  catch (e) { foot("中が見られん：" + e.message); }
}

function flatten(items, depth, out) {
  items.forEach(e => {
    out.push({ ...e, depth });
    if (e.dir && dtOpen.has(e.rel) && dtKids[e.rel]) flatten(dtKids[e.rel], depth + 1, out);
  });
  return out;
}

function renderRows() {
  const list = document.getElementById("dtList");
  list.innerHTML = "";
  const rows = flatten(dtTop, 0, []);
  rows.forEach(e => {
    const el = document.createElement("div");
    el.className = "it " + dtKind(e);
    el.style.paddingLeft = (12 + e.depth * 14) + "px";
    const tw = e.dir ? (dtOpen.has(e.rel) ? "▾" : "▸") : "";
    el.innerHTML = `<span class="tw">${tw}</span><span>${dtIcon(e)}</span>` +
                   `<span class="nm"></span><span class="mt">${e.mtime}</span>`;
    el.querySelector(".nm").textContent = e.name;
    el.title = e.rel + (e.dir ? "\n▸ を押すと中が見える" : "") + "\n枝にドラッグしたらZへ入る";
    if (e.dir) el.querySelector(".tw").onclick = ev => { ev.stopPropagation(); toggleDir(e.rel); };
    el.oncontextmenu = ev => sideMenu(ev, e, "dt");
    el.ondblclick = () => {
      if (e.dir) toggleDir(e.rel);
      else if (mode === "helper")
        fetch(HELPER + "/api/open?path=" + encodeURIComponent("デスクトップ\\" + e.rel)).catch(() => { });
    };
    el.draggable = true;
    el.ondragstart = ev => {
      ev.dataTransfer.setData("text/plain", "dt:" + e.rel);
      ev.dataTransfer.effectAllowed = "move";
    };
    list.appendChild(el);
  });
  const links = dtTop.filter(e => /\.(lnk|url)$/i.test(e.name)).length;
  document.getElementById("dtCount").textContent =
    `${dtTop.length}個（ショートカット${links} / 実体${dtTop.length - links}）`;
}

/* ---- 枝の中身（Zに実際に入ってる物） ---- */
let zOpen = new Set(), zKids = {}, zCur = null;

async function zLoad(rel) {                       // rel: "Z" or "Z\\組織\\役員選挙"
  if (zKids[rel]) return zKids[rel];
  const r = await fetch(HELPER + "/api/list?path=" + encodeURIComponent(rel) + "&t=" + Math.random());
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  zKids[rel] = j.entries.map(e => ({
    name: e.name, rel: rel + "\\" + e.name, dir: e.dir, mtime: (e.mtime || "").slice(0, 10)
  }));
  return zKids[rel];
}

async function showBranch(nodeId) {
  const path = pathOf(nodeId);
  const rel = ["Z"].concat(path).join("\\");
  zCur = rel; zOpen = new Set(); zKids = {};
  const box = document.getElementById("zList");
  document.getElementById("zCount").textContent = "";
  if (mode !== "helper") { box.innerHTML = `<div class="dead">このPCでは中身を見れん（読み役がおらん）</div>`; return; }
  box.innerHTML = `<div class="dead">読んでる…</div>`;
  try {
    await zLoad(rel);
    zRender();
  } catch (e) {
    box.innerHTML = `<div class="dead">Zにまだこのフォルダーは無い<br><span style="font-size:11px">${rel}</span></div>`;
  }
}

function zRender() {
  const box = document.getElementById("zList");
  box.innerHTML = "";
  const head = document.createElement("div");
  head.className = "zpath";
  head.textContent = zCur.replace(/^Z/, "Z:");
  box.appendChild(head);

  const rows = [];
  const walk = (rel, depth) => {
    (zKids[rel] || []).forEach(e => {
      rows.push({ ...e, depth });
      if (e.dir && zOpen.has(e.rel)) walk(e.rel, depth + 1);
    });
  };
  walk(zCur, 0);

  if (!rows.length) box.appendChild(Object.assign(document.createElement("div"),
    { className: "dead", textContent: "空っぽ" }));

  rows.forEach(e => {
    const el = document.createElement("div");
    el.className = "it " + dtKind(e);
    el.style.paddingLeft = (12 + e.depth * 14) + "px";
    el.innerHTML = `<span class="tw">${e.dir ? (zOpen.has(e.rel) ? "▾" : "▸") : ""}</span>` +
                   `<span>${dtIcon(e)}</span><span class="nm"></span><span class="mt">${e.mtime}</span>`;
    el.querySelector(".nm").textContent = e.name;
    el.title = e.rel.replace(/^Z/, "Z:");
    if (e.dir) el.querySelector(".tw").onclick = async ev => {
      ev.stopPropagation();
      if (zOpen.has(e.rel)) zOpen.delete(e.rel);
      else { try { await zLoad(e.rel); zOpen.add(e.rel); } catch (x) { } }
      zRender();
    };
    el.oncontextmenu = ev => sideMenu(ev, e, "z");
    el.ondblclick = async () => {
      if (e.dir) {
        if (zOpen.has(e.rel)) zOpen.delete(e.rel);
        else { try { await zLoad(e.rel); zOpen.add(e.rel); } catch (x) { } }
        zRender();
      } else fetch(HELPER + "/api/open?path=" + encodeURIComponent(e.rel)).catch(() => { });
    };
    box.appendChild(el);
  });
  document.getElementById("zCount").textContent = (zKids[zCur] || []).length + "個";
}

/* 写し・フォルダ選択方式から呼ばれる用（開閉なし） */
function drawDesktop(items) {
  dtTop = items.map(e => ({ ...e, rel: e.name }));
  dtOpen = new Set(); dtKids = {};
  renderRows();
}

/* ---- 実際に移す ---- */
async function uniqName(dir, name) {
  const has = async n => {
    try { await dir.getFileHandle(n); return true; } catch (e) { }
    try { await dir.getDirectoryHandle(n); return true; } catch (e) { }
    return false;
  };
  if (!await has(name)) return name;
  const dot = name.lastIndexOf(".");
  const base = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
  for (let i = 2; i < 999; i++) {
    const c = `${base} (${i})${ext}`;
    if (!await has(c)) return c;
  }
  return name + "_" + Date.now();
}

async function copyFile(srcH, destDir, name) {
  const f = await srcH.getFile();
  const w = await (await destDir.getFileHandle(name, { create: true })).createWritable();
  await w.write(f);
  await w.close();
}

async function copyDir(srcDir, destParent, name, prog) {
  const dest = await destParent.getDirectoryHandle(name, { create: true });
  for await (const [n, h] of srcDir.entries()) {
    if (h.kind === "file") { await copyFile(h, dest, n); prog.n++; }
    else await copyDir(h, dest, n, prog);
    if (prog.n % 20 === 0) foot(`運んでる… ${prog.n}件`);
  }
  return dest;
}

async function stow(name, nodeId) {
  const path = pathOf(nodeId);
  const where = "Z:\\" + path.join("\\");

  if (mode === "mirror") { alert("このPCでは動かせん（写しを見てるだけ）。"); return; }
  if (mode === "helper") {
    if (!confirm(`「${name}」を\n${where}\nへ移す。ええ？`)) return;
    try {
      const r = await fetch(HELPER + "/api/stow", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, path })
      });
      const j = await r.json();
      if (j.error) { alert("入らんかった：" + j.error); return; }
      foot(`「${name}」を ${where} へ入れた`);
      zKids = {}; if (sel) showBranch(sel);
    } catch (e) { alert("読み役が落ちてる。PCを再起動するか、Z:\\_ツール\\seiri\\起動.bat を実行して。"); }
    listDesktop(); return;
  }

  if (!deskH || !zH) { alert("先に場所を教えて（右下のボタン）"); return; }
  if (!confirm(`「${name}」を\n${where}\nへ移す。ええ？`)) return;
  try {
    let dest = zH;
    for (const p of path) dest = await dest.getDirectoryHandle(p, { create: true });

    let src = null, isDir = false;
    try { src = await deskH.getFileHandle(name); }
    catch (e) { src = await deskH.getDirectoryHandle(name); isDir = true; }

    const to = await uniqName(dest, name);
    const prog = { n: 0 };
    foot(`運んでる… ${name}`);
    if (isDir) await copyDir(src, dest, to, prog);
    else await copyFile(src, dest, to);

    await deskH.removeEntry(name, { recursive: isDir });
    foot(`「${name}」を ${where} へ入れた`);
    listDesktop();
  } catch (e) {
    alert("入らんかった：" + (e && e.message ? e.message : e));
    listDesktop();
  }
}

listDesktop();

/* ---- 右パネルの幅をドラッグで変える ---- */
(function () {
  const grip = document.getElementById("grip");
  const setW = w => {
    w = Math.max(220, Math.min(innerWidth - 320, w));
    document.documentElement.style.setProperty("--sideW", w + "px");

/* ---- 右クリックメニュー（開く・名前変更・ゴミ箱） ---- */

（消える訳やない。trashboxから戻せる）`)) return;

}
